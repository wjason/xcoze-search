name: Publish preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check versions and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/prepare_release.py --tag "$RELEASE_TAG" --output release-notes.md
      - name: Build packages
        run: python scripts/build_release.py --output-dir release
      - name: Verify package hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish complete preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/xcoze-search-skill-*.zip release/xcoze-search-source-*.zip release/SHA256SUMS.txt --verify-tag --draft --prerelease --title "xcoze search $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
